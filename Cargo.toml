[package]
name = "asr-compare-tui"
version = "0.1.0"
edition = "2021"
description = "ASR 模型对比 TUI 工具：采集系统音频，实时对比多个 Sherpa 流式模型的识别效果"

[dependencies]
# sherpa-onnx 同时承担流式模型、离线模型与 Silero VAD。
# Linux 下由 sherpa-onnx-sys 的 build.rs 自动下载 linux-x64 预编译静态库。
sherpa-onnx = "1.13.2"
anyhow = "1"
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3"
# 解析 `pactl -f json` 的输出（系统音频设备枚举）。
serde_json = "1"
